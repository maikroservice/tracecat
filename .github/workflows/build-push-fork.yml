name: Build and push fork images

# Each architecture builds NATIVELY on its own runner (amd64 on ubuntu-latest,
# arm64 on GitHub's free-for-public-repos ubuntu-24.04-arm) and pushes by
# digest; a final job stitches the multi-arch manifest with imagetools.
# This replaces the old single-runner QEMU cross-build, which emulated the
# entire arm64 build (30+ min Next.js builds, OOM failures).

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit image tag (e.g. 1.0.0-beta.50-bm.1); empty = automatic versioning"
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/maikroservice/tracecat
  UI_IMAGE: ghcr.io/maikroservice/tracecat-ui

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Manual dispatch builds everything; pushes build only what changed
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      ui: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'tracecat/**'
              - 'packages/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic/**'
              - 'entrypoint.sh'
            ui:
              - 'frontend/**'

  version:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.api.outputs.version }}
      ui: ${{ steps.ui.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get next API version
        id: api
        env:
          EXPLICIT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EXPLICIT_TAG" ]; then
            if ! printf '%s' "$EXPLICIT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "Invalid image tag: $EXPLICIT_TAG" >&2
              exit 1
            fi
            echo "version=$EXPLICIT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using explicit tag: $EXPLICIT_TAG"
            exit 0
          fi
          TOKEN=$(echo "${{ secrets.GITHUB_TOKEN }}" | base64)
          TAGS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/maikroservice/tracecat/tags/list" | jq -r '.tags[]?' 2>/dev/null || echo "")

          if [ -z "$TAGS" ]; then
            version=$(python -c "exec(open('tracecat/__init__.py').read()); print(__version__)")
          else
            latest=$(echo "$TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ -z "$latest" ]; then
              version=$(python -c "exec(open('tracecat/__init__.py').read()); print(__version__)")
            else
              IFS='.' read -r major minor patch <<< "$latest"
              version="${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next API version: $version"

      - name: Get next UI version
        id: ui
        env:
          EXPLICIT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EXPLICIT_TAG" ]; then
            if ! printf '%s' "$EXPLICIT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "Invalid image tag: $EXPLICIT_TAG" >&2
              exit 1
            fi
            echo "version=$EXPLICIT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using explicit tag: $EXPLICIT_TAG"
            exit 0
          fi
          TOKEN=$(echo "${{ secrets.GITHUB_TOKEN }}" | base64)
          TAGS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/maikroservice/tracecat-ui/tags/list" | jq -r '.tags[]?' 2>/dev/null || echo "")

          if [ -z "$TAGS" ]; then
            version=$(python -c "exec(open('tracecat/__init__.py').read()); print(__version__)")
          else
            latest=$(echo "$TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ -z "$latest" ]; then
              version=$(python -c "exec(open('tracecat/__init__.py').read()); print(__version__)")
            else
              IFS='.' read -r major minor patch <<< "$latest"
              version="${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next UI version: $version"

  build-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=api-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=api-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.API_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-api-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    needs: [build-api, version]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-api-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$API_IMAGE:${{ needs.version.outputs.api }}" \
            -t "$API_IMAGE:latest" \
            $(printf "$API_IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$API_IMAGE:${{ needs.version.outputs.api }}"

  build-ui:
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=ui-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=ui-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_SERVER_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_ENV=production
            NODE_ENV=production
          outputs: type=image,name=${{ env.UI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-ui-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ui:
    needs: [build-ui, version]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-ui-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$UI_IMAGE:${{ needs.version.outputs.ui }}" \
            -t "$UI_IMAGE:latest" \
            $(printf "$UI_IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$UI_IMAGE:${{ needs.version.outputs.ui }}"
