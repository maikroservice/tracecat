name: Local build and push (act)

# Designed to be run LOCALLY with nektos/act (installed as `gh act`), not on
# GitHub — workflow_dispatch only, so pushes never trigger it. It deliberately
# avoids GitHub-only services (artifact server, GHA cache) that act does not
# provide: each image is built and pushed with tags directly.
#
# Usage (from the repo root):
#   gh act workflow_dispatch -W .github/workflows/build-push-local.yml \
#     -s GITHUB_TOKEN="$GHCR_PAT" \
#     --input component=all \
#     --input platforms=linux/amd64,linux/arm64 \
#     --input version=1.0.0-beta.51
#
# - GHCR_PAT: a classic PAT with write:packages (gh auth refresh -s write:packages,
#   then `gh auth token`, also works).
# - `platforms`: on an arm64 host the arm64 half builds natively and the amd64
#   half runs under QEMU (slow) — and vice versa. Pass a single platform to
#   build only what you need.
# - `version`: defaults to __version__ in tracecat/__init__.py.
# - Add `--input push=false` for a build-only dry run.

on:
  workflow_dispatch:
    inputs:
      component:
        description: Which image(s) to build
        type: choice
        options: [all, api, ui]
        default: all
      platforms:
        description: Comma-separated platforms
        type: string
        default: linux/amd64,linux/arm64
      version:
        description: Image tag (defaults to tracecat/__init__.py __version__)
        type: string
        default: ""
      push:
        description: Push to GHCR
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/maikroservice/tracecat
  UI_IMAGE: ghcr.io/maikroservice/tracecat-ui

jobs:
  build-api:
    if: inputs.component != 'ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(python3 -c "exec(open('tracecat/__init__.py').read()); print(__version__)")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "API version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.API_IMAGE }}:latest

  build-ui:
    if: inputs.component != 'api'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(python3 -c "exec(open('tracecat/__init__.py').read()); print(__version__)")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "UI version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build UI
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_SERVER_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_ENV=production
            NODE_ENV=production
          tags: |
            ${{ env.UI_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.UI_IMAGE }}:latest
