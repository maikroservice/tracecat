name: Lint python

on:
  push:
    branches: [ "main" ]
    paths:
      - tracecat/**
      - packages/**
      - alembic/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-python.yml
  pull_request:
    branches: [ "main", "staging" ]
    paths:
      - tracecat/**
      - packages/**
      - alembic/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-python.yml

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "tracecat/ tests/ packages/ alembic/"
          version: "0.15.0"
          args: check --no-fix

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "tracecat/ tests/ packages/ alembic/"
          version: "0.15.0"
          args: format --diff

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --no-install-project --group lint

      - name: Run basedpyright
        run: uv run --no-sync basedpyright --warnings --threads 4
