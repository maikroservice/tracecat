name: Frontend code quality

on:
  push:
    branches: ["main"]
    paths:
      - frontend/**
      - tracecat/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-frontend.yml
  pull_request:
    branches: ["main", "staging"]
    paths:
      - frontend/**
      - tracecat/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/lint-frontend.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python dependencies
        run: uv sync --no-install-project

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: frontend/
          version: 2.0.4

      - name: Run Biome
        working-directory: frontend
        run: biome ci .

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        working-directory: frontend
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend client is up to date
        run: |
          pnpm -C frontend generate-client-ci
          # openapi-ts output style doesn't match repo formatting; normalize generated client only
          pnpm -C frontend exec biome check --write src/client
          git diff --exit-code frontend/src/client/

      - name: Run TypeScript type check
        working-directory: frontend
        run: pnpm run typecheck
